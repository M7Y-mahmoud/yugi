<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأصدقاء - Yu-Gi-Oh!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script type="module" src="js/navbar.js"></script>
  <style>
    .friends-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-24);
      padding: var(--space-24) 0 var(--space-16);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .friends-header h1 {
      color: var(--gold-primary);
      font-family: var(--font-heading);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .friends-header h1 i {
      color: var(--gold-bright);
    }

    /* Tabs */
    .friends-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: var(--space-24);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      padding-bottom: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-arabic);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--gold-bright);
      background: rgba(212, 175, 55, 0.05);
    }

    .tab-btn.active {
      color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      border-color: rgba(212, 175, 55, 0.3);
      font-weight: bold;
    }

    .badge-count {
      background: var(--accent-wine);
      color: white;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: bold;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Search Section */
    .search-box-wrapper {
      display: flex;
      gap: 12px;
      margin-bottom: var(--space-24);
      max-width: 600px;
    }

    .search-input {
      flex: 1;
      background: rgba(18, 18, 18, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    .btn-search {
      background: var(--gold-primary);
      color: var(--bg-void);
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-search:hover {
      background: var(--gold-bright);
      transform: translateY(-2px);
    }

    /* Cards Grid */
    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .user-card {
      background: rgba(22, 16, 12, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .user-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-primary);
    }

    .user-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      object-fit: cover;
      background: var(--bg-panel);
    }

    .user-info {
      width: 100%;
    }

    .user-name {
      margin: 0 0 6px 0;
      color: var(--gold-primary);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .user-bio {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: auto;
    }

    .btn-action {
      flex: 1;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--gold-primary);
      color: var(--bg-void);
    }

    .btn-primary:hover {
      background: var(--gold-bright);
    }

    .btn-danger {
      background: rgba(231, 76, 60, 0.15);
      color: #e74c3c;
      border: 1px solid #e74c3c;
    }

    .btn-danger:hover {
      background: #e74c3c;
      color: white;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-disabled {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: default;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
      font-size: 1.1rem;
    }

    /* Chat Modal Styles */
    .chat-modal-content {
      background: rgba(22, 16, 12, 0.95);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      width: 95%;
      max-width: 520px;
      height: 550px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      overflow: hidden;
      margin: auto;
    }

    .chat-header {
      padding: 14px 18px;
      background: rgba(10, 6, 4, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-friend-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      object-fit: cover;
    }

    .chat-friend-name {
      margin: 0;
      color: var(--gold-primary);
      font-size: 1.05rem;
      font-weight: bold;
    }

    .chat-friend-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .close-chat-btn {
      background: transparent;
      border: none;
      color: var(--gold-primary);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .close-chat-btn:hover {
      color: var(--gold-bright);
    }

    .chat-messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(10, 6, 4, 0.4);
    }

    .chat-message-item {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
    }

    .chat-message-item.sent {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(184, 134, 11, 0.2));
      color: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-bottom-right-radius: 2px;
    }

    .chat-message-item.received {
      align-self: flex-end;
      background: rgba(40, 30, 22, 0.85);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom-left-radius: 2px;
    }

    .chat-message-time {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }

    .chat-msg-actions {
      display: inline-flex;
      gap: 6px;
      margin-right: 8px;
    }

    .chat-action-btn {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gold-bright);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .chat-action-btn:hover {
      background: var(--gold-primary);
      color: #000;
    }

    .chat-action-btn.delete-btn {
      border-color: rgba(231, 76, 60, 0.4);
      color: #e74c3c;
    }

    .chat-action-btn.delete-btn:hover {
      background: #e74c3c;
      color: #fff;
    }

    .chat-sender-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--gold-primary);
      margin-bottom: 4px;
    }

    .group-friend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: background 0.2s;
    }

    .group-friend-item:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    .group-friend-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--gold-primary);
      cursor: pointer;
    }

    .chat-input-area {
      padding: 12px 16px;
      background: rgba(10, 6, 4, 0.85);
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      font-family: var(--font-arabic);
    }

    .chat-input-area input:focus {
      border-color: var(--gold-primary);
    }

    .chat-send-btn {
      background: var(--gold-primary);
      color: var(--bg-void);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.2s;
      font-family: var(--font-arabic);
    }

    .chat-send-btn:hover {
      background: var(--gold-bright);
      transform: translateY(-1px);
    }

    /* Custom Toast Notifications */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
      pointer-events: none;
    }

    .custom-toast {
      pointer-events: auto;
      background: rgba(20, 14, 10, 0.95);
      border: 1px solid var(--gold-primary);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(212, 175, 55, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideInToast 0.3s ease forwards;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .custom-toast.toast-error {
      border-color: #e74c3c;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 10px rgba(231, 76, 60, 0.3);
    }

    .custom-toast.toast-success {
      border-color: #2ecc71;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 10px rgba(46, 204, 113, 0.3);
    }

    @keyframes slideInToast {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Custom Dialog Modals */
    .custom-dialog-box {
      background: rgba(22, 16, 12, 0.98);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.2);
      width: 90%;
      max-width: 420px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Group Members List Styling */
    .group-member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 8px;
      gap: 10px;
    }

    .group-member-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .group-member-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-bright);
      border: 1px solid var(--gold-primary);
      white-space: nowrap;
    }

    .group-member-badge.creator {
      background: rgba(231, 76, 60, 0.2);
      color: #ff6b6b;
      border-color: #e74c3c;
    }
  </style>
</head>
<body>
  <!-- زر الهمبرغر العائم -->
  <button id="hamburger-btn" class="floating-hamburger">
    <i class="ph ph-list"></i>
  </button>

  <!-- الطبقة الضبابية -->
  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- القائمة الجانبية -->
  <nav id="side-menu" class="side-menu">
    <div class="side-menu-header">
      <img src="public/assets/images/logo.png" alt="Yu-Gi-Oh!" class="side-logo">
      <button id="close-menu-btn" class="close-menu-btn">&times;</button>
    </div>

    <div class="side-menu-links">
      <a href="index.html"><i class="ph ph-house"></i> الرئيسية</a>
      <a href="library.html"><i class="ph ph-cards"></i> البطاقات</a>
      
      <div class="side-divider"></div>
      
      <a href="#" id="user-login-btn" class="login-link" style="display: none;"><i class="ph ph-sign-in"></i> تسجيل الدخول</a>
      
      <div id="user-profile-container" class="side-user-profile">
        <div class="user-welcome-box">
          <i class="ph ph-user"></i>
          <span id="user-welcome" style="color: var(--gold-bright);"></span>
        </div>
        <a href="account.html"><i class="ph ph-user-circle"></i> حسابي</a>
        <a href="favorites.html"><i class="ph ph-star"></i> المفضلة</a>
        <a href="friends.html" class="active"><i class="ph ph-users"></i> الأصدقاء</a>
        <a href="notifications.html"><i class="ph ph-bell"></i> الإشعارات</a>
        <a href="settings.html"><i class="ph ph-gear"></i> الإعدادات</a>
        <a href="admin/dashboard.html" id="admin-link-dropdown" style="display: none;"><i class="ph ph-shield-check"></i> الإدارة</a>
        <button id="user-logout-btn" class="side-logout-btn"><i class="ph ph-sign-out"></i> تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="friends-header">
      <h1><i class="ph ph-users"></i> الأصدقاء</h1>
      <div style="display: flex; align-items: center; gap: 15px;">
        <button id="open-create-group-btn" class="btn-search" style="background: linear-gradient(135deg, var(--gold-primary), var(--gold-bright)); color:#0d0805; font-size:0.9rem; padding: 9px 16px;">
          <i class="ph ph-plus-circle"></i> إنشاء جروب شات
        </button>
        <span id="friends-total-count" style="color: var(--text-muted); font-size: 1.1rem;">0 صديق</span>
      </div>
    </div>

    <!-- الأقسام/المبوبة -->
    <div class="friends-tabs">
      <button class="tab-btn active" data-tab="tab-friends-list">
        <i class="ph ph-user-check"></i> قائمة الأصدقاء
      </button>
      <button class="tab-btn" data-tab="tab-group-chats">
        <i class="ph ph-users-three"></i> جروبات الشات
        <span id="badge-groups" class="badge-count" style="display: none;">0</span>
      </button>
      <button class="tab-btn" data-tab="tab-incoming-requests">
        <i class="ph ph-arrow-down-left"></i> الطلبات الواردة
        <span id="badge-incoming" class="badge-count" style="display: none;">0</span>
      </button>
      <button class="tab-btn" data-tab="tab-outgoing-requests">
        <i class="ph ph-arrow-up-right"></i> الطلبات الصادرة
        <span id="badge-outgoing" class="badge-count" style="display: none;">0</span>
      </button>
      <button class="tab-btn" data-tab="tab-search-users">
        <i class="ph ph-magnifying-glass"></i> البحث عن أصدقاء
      </button>
    </div>

    <div id="loading-state" style="text-align: center; color: var(--text-muted); font-size: 1.2rem; padding: 40px;">
      جاري التحميل...
    </div>

    <!-- تبويب 1: قائمة الأصدقاء -->
    <div id="tab-friends-list" class="tab-content active">
      <div id="friends-list-container" class="user-grid"></div>
    </div>

    <!-- تبويب الجروبات -->
    <div id="tab-group-chats" class="tab-content">
      <div id="group-chats-container" class="user-grid"></div>
    </div>

    <!-- تبويب 2: الطلبات الواردة -->
    <div id="tab-incoming-requests" class="tab-content">
      <div id="incoming-requests-container" class="user-grid"></div>
    </div>

    <!-- تبويب 3: الطلبات الصادرة -->
    <div id="tab-outgoing-requests" class="tab-content">
      <div id="outgoing-requests-container" class="user-grid"></div>
    </div>

    <!-- تبويب 4: البحث عن أصدقاء -->
    <div id="tab-search-users" class="tab-content">
      <div class="search-box-wrapper">
        <input type="text" id="user-search-input" class="search-input" placeholder="ابحث باسم المستخدم (username)...">
        <button id="user-search-btn" class="btn-search">
          <i class="ph ph-magnifying-glass"></i> بحث
        </button>
      </div>
      <div id="search-results-container" class="user-grid"></div>
    </div>
  </main>

  <!-- نافذة محادثة الأصدقاء -->
  <div id="friend-chat-modal" class="modal" style="z-index: 3000;">
    <div class="chat-modal-content">
      <div class="chat-header">
        <div class="chat-friend-info">
          <img id="chat-friend-avatar" src="" alt="avatar" class="chat-avatar">
          <div>
            <h3 id="chat-friend-name" class="chat-friend-name">اسم الصديق</h3>
            <span id="chat-friend-status" class="chat-friend-status">جاري التحقق...</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="group-info-btn" class="chat-action-btn" style="display: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;" title="إعدادات ومعلومات الجروب">
            <i class="ph ph-gear"></i> معلومات الجروب
          </button>
          <button id="close-chat-modal" class="close-chat-btn">&times;</button>
        </div>
      </div>

      <div id="chat-messages-container" class="chat-messages-container">
        <!-- Messages loaded dynamically -->
      </div>

      <div class="chat-input-area">
        <input type="text" id="chat-message-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button id="chat-send-btn" class="chat-send-btn">
          <i class="ph ph-paper-plane-right"></i> إرسال
        </button>
      </div>
    </div>
  </div>

  <!-- نافذة معلومات وإدارة الجروب -->
  <div id="group-info-modal" class="modal" style="z-index: 3400;">
    <div class="chat-modal-content" style="height: auto; max-height: 85vh; padding: 20px; width: 92%; max-width: 520px; overflow-y: auto;">
      <div class="chat-header" style="background: transparent; border-bottom: 1px solid rgba(212,175,55,0.2); padding: 0 0 15px 0;">
        <h3 style="margin:0; color: var(--gold-bright); font-size: 1.3rem; display:flex; align-items:center; gap:8px;">
          <i class="ph ph-users-three"></i> معلومات الجروب
        </h3>
        <button id="close-group-info-modal" class="close-chat-btn">&times;</button>
      </div>

      <!-- عرض تفاصيل الجروب الحالية -->
      <div style="text-align: center; margin: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <img id="group-info-avatar-img" src="" alt="Group Avatar" style="width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--gold-primary); object-fit: cover;">
        <h2 id="group-info-display-name" style="color: #fff; font-size: 1.3rem; margin: 0;">اسم الجروب</h2>
        <p id="group-info-display-desc" style="color: var(--text-muted); font-size: 0.88rem; margin: 0;">لا يوجد وصف للجروب</p>
        <button id="btn-toggle-edit-group" class="chat-action-btn" style="display: none; padding: 5px 12px; margin-top: 5px;">
          <i class="ph ph-pencil-simple"></i> تعديل بيانات الجروب
        </button>
      </div>

      <!-- نموذج تعديل بيانات الجروب (للأدمن) -->
      <div id="edit-group-form-container" style="display: none; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); margin-bottom: 15px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div>
            <label style="color: var(--gold-primary); font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px;">اسم الجروب الجديد:</label>
            <input type="text" id="edit-group-name-input" class="search-input" style="width: 100%; box-sizing: border-box;">
          </div>
          <div>
            <label style="color: var(--gold-primary); font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px;">رابط صورة الجروب (Avatar URL):</label>
            <input type="text" id="edit-group-avatar-input" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="https://...">
          </div>
          <div>
            <label style="color: var(--gold-primary); font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px;">وصف الجروب:</label>
            <input type="text" id="edit-group-desc-input" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="مثال: مجموعتنا للتحديات والنقاش">
          </div>
          <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 5px;">
            <button id="save-group-edit-btn" class="btn-search" style="padding: 6px 14px; font-size: 0.85rem;"><i class="ph ph-check"></i> حفظ التغييرات</button>
            <button id="cancel-group-edit-btn" class="chat-action-btn" style="padding: 6px 14px;"><i class="ph ph-x"></i> إلغاء</button>
          </div>
        </div>
      </div>

      <!-- قسم قائمة الأعضاء -->
      <div style="margin-top: 15px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <h4 style="margin: 0; color: var(--gold-bright); font-size: 1rem; display: flex; align-items: center; gap: 6px;">
            <i class="ph ph-users"></i> أعضاء الجروب (<span id="group-info-members-count">0</span>)
          </h4>
          <button id="btn-toggle-add-member" class="btn-search" style="display: none; padding: 5px 12px; font-size: 0.8rem;">
            <i class="ph ph-user-plus"></i> إضافة أعضاء
          </button>
        </div>

        <!-- نموذج إضافة عضو جديد (للأدمن) -->
        <div id="add-member-form-container" style="display: none; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); margin-bottom: 12px;">
          <label style="color: var(--gold-primary); font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 6px;">اختر من أصدقائك غير الموجودين بالجروب:</label>
          <div id="add-member-checklist" style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px;">
            <!-- Populated dynamically -->
          </div>
          <div style="display: flex; gap: 8px; justify-content: flex-end;">
            <button id="submit-add-members-btn" class="btn-search" style="padding: 5px 12px; font-size: 0.8rem;"><i class="ph ph-plus"></i> إضافة المحددين</button>
            <button id="cancel-add-members-btn" class="chat-action-btn" style="padding: 5px 12px;"><i class="ph ph-x"></i> إلغاء</button>
          </div>
        </div>

        <!-- قائمة الأعضاء -->
        <div id="group-members-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto;">
          <!-- Member items populated dynamically -->
        </div>
      </div>

      <div style="margin-top: 20px; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 15px; display: flex; justify-content: space-between; align-items: center;">
        <button id="leave-group-btn" class="chat-action-btn delete-btn" style="padding: 8px 16px; font-size: 0.88rem;">
          <i class="ph ph-sign-out"></i> مغادرة الجروب
        </button>
      </div>
    </div>
  </div>

  <!-- نافذة إنشاء جروب شات -->
  <div id="create-group-modal" class="modal" style="z-index: 3200;">
    <div class="chat-modal-content" style="height: auto; max-height: 85vh; padding: 20px;">
      <div class="chat-header" style="background: transparent; border-bottom: 1px solid rgba(212,175,55,0.2); padding: 0 0 15px 0;">
        <h3 style="margin:0; color: var(--gold-bright); font-size: 1.3rem; display:flex; align-items:center; gap:8px;">
          <i class="ph ph-users-three"></i> إنشاء جروب شات جديد
        </h3>
        <button id="close-create-group-modal" class="close-chat-btn">&times;</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
        <div>
          <label style="display: block; color: var(--gold-primary); font-size: 0.9rem; margin-bottom: 6px; font-weight: bold;">اسم الجروب:</label>
          <input type="text" id="new-group-name-input" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="مثال: أبطال المبارزة">
        </div>

        <div>
          <label style="display: block; color: var(--gold-primary); font-size: 0.9rem; margin-bottom: 6px; font-weight: bold;">اختر الأعضاء من أصدقائك:</label>
          <div id="group-friends-checklist" style="max-height: 220px; overflow-y: auto; background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.2); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
            <!-- Populated via js/friends.js -->
          </div>
        </div>

        <button id="submit-create-group-btn" class="btn-search" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;">
          <i class="ph ph-check-circle"></i> إنشاء الجروب الآن
        </button>
      </div>
    </div>
  </div>

  <!-- حاوية التنبيهات المنبثقة Toast Notifications -->
  <div id="toast-container"></div>

  <!-- نافذة حوار التأكيد Custom Confirm Modal -->
  <div id="custom-confirm-modal" class="modal" style="z-index: 9100;">
    <div class="custom-dialog-box">
      <h3 id="custom-confirm-title" style="margin:0; color: var(--gold-bright); font-size: 1.1rem; display:flex; align-items:center; gap:8px;">
        <i class="ph ph-warning-circle"></i> تأكيد العملية
      </h3>
      <p id="custom-confirm-message" style="color: #ddd; font-size: 0.95rem; margin: 0; line-height: 1.5;">هل أنت تأكد؟</p>
      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
        <button id="custom-confirm-cancel-btn" class="chat-action-btn" style="padding: 8px 16px; font-size: 0.9rem;">إلغاء</button>
        <button id="custom-confirm-ok-btn" class="btn-search" style="padding: 8px 18px; font-size: 0.9rem;">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- نافذة حوار الإدخال Custom Prompt Modal -->
  <div id="custom-prompt-modal" class="modal" style="z-index: 9000;">
    <div class="custom-dialog-box">
      <h3 id="custom-prompt-title" style="margin:0; color: var(--gold-bright); font-size: 1.1rem; display:flex; align-items:center; gap:8px;">
        <i class="ph ph-pencil"></i> إدخال بيانات
      </h3>
      <div>
        <input type="text" id="custom-prompt-input" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="">
      </div>
      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 5px;">
        <button id="custom-prompt-cancel-btn" class="chat-action-btn" style="padding: 8px 16px; font-size: 0.9rem;">إلغاء</button>
        <button id="custom-prompt-confirm-btn" class="btn-search" style="padding: 8px 18px; font-size: 0.9rem;">حفظ</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/friends.js"></script>
</body>
</html>
