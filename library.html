<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبتي - Yu-Gi-Oh!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/library.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .deck-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .deck-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .deck-card h3 {
      margin: 0;
      color: var(--primary-color);
      font-size: 1.5rem;
    }
    .deck-card p {
      margin: 0;
      color: var(--text-secondary);
    }
    .deck-actions-btn {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-play {
      background-color: var(--primary-color);
      color: var(--bg-color);
      font-weight: bold;
      flex: 1;
      min-width: 100px;
    }
    .btn-preview {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      flex: 1;
      min-width: 100px;
    }
    .btn-delete {
      background-color: #ef4444;
      color: white;
      font-weight: bold;
      flex: 1;
      min-width: 100px;
    }
  </style>
  <script type="module" src="js/navbar.js"></script>
</head>
<body>
   <!-- زر الهمبرغر العائم في زاوية الشاشة -->
  <button id="hamburger-btn" class="floating-hamburger">
    <i class="ph ph-list"></i>
  </button>

  <!-- الطبقة الضبابية في الخلفية -->
  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- القائمة الجانبية -->
  <nav id="side-menu" class="side-menu">
    <div class="side-menu-header">
      <img src="public/assets/images/logo.png" alt="Yu-Gi-Oh!" class="side-logo">
      <button id="close-menu-btn" class="close-menu-btn">&times;</button>
    </div>

    <div class="side-search">
      <input type="text" placeholder="ابحث...">
      <span class="search-icon"><i class="ph ph-magnifying-glass"></i></span>
    </div>

    <div class="side-menu-links">
      <a href="index.html" class="active"><i class="ph ph-house"></i> الرئيسية</a>
      <a href="library.html"><i class="ph ph-cards"></i> البطاقات</a>
      
      <div class="side-divider"></div>
      
      <!-- قسم المستخدم -->
      <a href="#" id="user-login-btn" class="login-link"><i class="ph ph-sign-in"></i> تسجيل الدخول</a>
      
      <div id="user-profile-container" style="display: none;" class="side-user-profile">
        <div class="user-welcome-box">
          <i class="ph ph-user"></i>
          <span id="user-welcome" style="color: var(--gold-bright);"></span>
        </div>
        <a href="account.html"><i class="ph ph-user-circle"></i> حسابي</a>
        <a href="admin/dashboard.html" id="admin-link-dropdown" style="display: none;"><i class="ph ph-shield-check"></i> الإدارة</a>
        <button id="user-logout-btn" class="side-logout-btn"><i class="ph ph-sign-out"></i> تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container" style="margin-top: 40px;">
    <div id="loading-state" style="text-align: center; font-size: 1.2rem; color: var(--text-secondary);">
      جاري تحميل مجموعاتك...
    </div>
    
    <div id="decks-container" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>مجموعاتي المحفوظة</h2>
      </div>
      <div id="saved-decks-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        <!-- Saved decks will appear here -->
      </div>
    </div>
  </main>

  <!-- Deck Edit Modal -->
  <div id="deck-edit-modal" class="modal" style="z-index: 2000;">
    <div class="modal-content" style="max-width: 900px; padding: 20px; width: 95%;">
      <span class="close-btn" id="close-edit-modal">&times;</span>
      <h2 id="edit-deck-name-header" style="margin-top: 0; color: var(--text-primary);">تعديل المجموعة</h2>
      <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <span class="deck-count-label">عدد الكروت الأساسية: <span id="edit-deck-count">0</span> / 60</span>
        <div style="display: flex; gap: 10px; align-items: center;">
          <label style="color: var(--text-primary); font-size: 0.9rem;">الخصوصية:</label>
          <select id="edit-deck-visibility" style="background: var(--bg-void); color: var(--gold-primary); border: 1px solid var(--gold-primary); border-radius: 4px; padding: 5px;">
            <option value="private">خاص</option>
            <option value="public">عام</option>
          </select>
        </div>
      </div>
      <div id="edit-cards-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; max-height: 60vh; overflow-y: auto;">
        <!-- Cards will be dynamically loaded here -->
      </div>
      <div style="margin-top: 20px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap;">
        <button id="edit-add-more-btn" class="btn-primary" style="font-size: 1.05rem; padding: 10px 24px; display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #ffd700, #d4af37); color: #120c08; border: 1px solid #ffe600; border-radius: 8px; font-weight: bold; cursor: pointer;">
          <i class="ph ph-plus-circle"></i> إضافة المزيد
        </button>
        <button id="edit-save-btn" class="btn-secondary" style="font-size: 1.1rem; padding: 10px 30px;">حفظ التعديلات</button>
      </div>
    </div>
  </div>

  <!-- Replace Card Selection Modal -->
  <div id="replace-card-modal" class="modal" style="z-index: 3000;">
    <div class="modal-content" style="max-width: 900px; padding: 20px; width: 95%;">
      <span class="close-btn" id="close-replace-modal">&times;</span>
      <h2 id="replace-modal-title" style="margin-top: 0; color: var(--text-primary);">اختر بطاقة بديلة</h2>
      <div class="controls" style="margin-bottom: 15px;">
        <input type="text" id="replace-search-input" placeholder="ابحث باسم الكارت...">
        <select id="replace-type-filter">
          <option value="all">كل الأنواع</option>
          <option value="Monster">وحش (Monster)</option>
          <option value="Spell">سحر (Spell)</option>
          <option value="Trap">فخ (Trap)</option>
        </select>
      </div>
      <div id="replace-cards-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; max-height: 60vh; overflow-y: auto;">
        <!-- DB Cards will be dynamically loaded here -->
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/my-library.js"></script>
</body>
</html>
