<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإشعارات - Yu-Gi-Oh!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script type="module" src="js/navbar.js"></script>
  <style>
    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-24);
      padding: var(--space-24) 0 var(--space-16);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      flex-wrap: wrap;
      gap: 16px;
    }

    .notif-header h1 {
      color: var(--gold-primary);
      font-family: var(--font-heading);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .notif-header h1 i {
      color: var(--gold-bright);
    }

    .notif-actions {
      display: flex;
      gap: 10px;
    }

    .btn-notif-action {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gold-bright);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-arabic);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-notif-action:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: translateY(-1px);
    }

    .btn-danger-outline {
      background: rgba(231, 76, 60, 0.1);
      border-color: rgba(231, 76, 60, 0.3);
      color: #e74c3c;
    }

    .btn-danger-outline:hover {
      background: rgba(231, 76, 60, 0.25);
    }

    /* Filter Tabs */
    .notif-filters {
      display: flex;
      gap: 12px;
      margin-bottom: var(--space-24);
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-arabic);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .filter-btn.active {
      color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.12);
      border-color: rgba(212, 175, 55, 0.3);
      font-weight: bold;
    }

    .unread-badge {
      background: var(--accent-wine);
      color: white;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* Notifications List */
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 800px;
    }

    .notif-card {
      background: rgba(22, 16, 12, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      position: relative;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .notif-card:hover {
      border-color: var(--gold-primary);
      background: rgba(30, 22, 16, 0.9);
    }

    .notif-card.unread {
      background: rgba(35, 25, 18, 0.95);
      border-right: 4px solid var(--gold-primary);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .notif-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-bright);
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .notif-card.unread .notif-icon-box {
      background: rgba(212, 175, 55, 0.25);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .notif-content {
      flex: 1;
    }

    .notif-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .notif-title {
      font-weight: bold;
      color: var(--gold-bright);
      font-size: 1.05rem;
      margin: 0;
    }

    .notif-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .notif-message {
      color: var(--text-primary);
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .notif-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-notif-small {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .btn-notif-small:hover {
      color: var(--gold-primary);
    }

    .btn-notif-small.delete-notif:hover {
      color: #e74c3c;
    }

    .empty-notif {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-size: 1.1rem;
    }

    .empty-notif i {
      font-size: 3rem;
      color: rgba(212, 175, 55, 0.3);
      margin-bottom: 12px;
      display: block;
    }
  </style>
</head>
<body>
  <!-- زر الهمبرغر العائم -->
  <button id="hamburger-btn" class="floating-hamburger">
    <i class="ph ph-list"></i>
  </button>

  <!-- الطبقة الضبابية -->
  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- القائمة الجانبية -->
  <nav id="side-menu" class="side-menu">
    <div class="side-menu-header">
      <img src="public/assets/images/logo.png" alt="Yu-Gi-Oh!" class="side-logo">
      <button id="close-menu-btn" class="close-menu-btn">&times;</button>
    </div>

    <div class="side-menu-links">
      <a href="index.html"><i class="ph ph-house"></i> الرئيسية</a>
      <a href="library.html"><i class="ph ph-cards"></i> البطاقات</a>
      
      <div class="side-divider"></div>
      
      <a href="#" id="user-login-btn" class="login-link" style="display: none;"><i class="ph ph-sign-in"></i> تسجيل الدخول</a>
      
      <div id="user-profile-container" class="side-user-profile">
        <div class="user-welcome-box">
          <i class="ph ph-user"></i>
          <span id="user-welcome" style="color: var(--gold-bright);"></span>
        </div>
        <a href="account.html"><i class="ph ph-user-circle"></i> حسابي</a>
        <a href="favorites.html"><i class="ph ph-star"></i> المفضلة</a>
        <a href="friends.html"><i class="ph ph-users"></i> الأصدقاء</a>
        <a href="notifications.html" class="active"><i class="ph ph-bell"></i> الإشعارات</a>
        <a href="settings.html"><i class="ph ph-gear"></i> الإعدادات</a>
        <a href="admin/dashboard.html" id="admin-link-dropdown" style="display: none;"><i class="ph ph-shield-check"></i> الإدارة</a>
        <button id="user-logout-btn" class="side-logout-btn"><i class="ph ph-sign-out"></i> تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="notif-header">
      <h1><i class="ph ph-bell"></i> الإشعارات</h1>
      <div class="notif-actions">
        <button id="mark-all-read-btn" class="btn-notif-action">
          <i class="ph ph-checks"></i> تحديد الكل كمقروء
        </button>
        <button id="clear-all-btn" class="btn-notif-action btn-danger-outline">
          <i class="ph ph-trash"></i> مسح جميع الإشعارات
        </button>
      </div>
    </div>

    <div class="notif-filters">
      <button class="filter-btn active" data-filter="all">
        الكل
      </button>
      <button class="filter-btn" data-filter="unread">
        غير مقروء <span id="unread-count" class="unread-badge" style="display: none;">0</span>
      </button>
    </div>

    <div id="loading-state" style="text-align: center; color: var(--text-muted); font-size: 1.2rem; padding: 40px;">
      جاري تحميل الإشعارات...
    </div>

    <div id="notif-list-container" class="notif-list"></div>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/notifications.js"></script>
</body>
</html>
