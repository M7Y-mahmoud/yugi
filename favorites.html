<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكروت المفضلة - Yu-Gi-Oh!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script type="module" src="js/navbar.js"></script>
  <style>
    /* Favorites Header */
    .favorites-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-24);
      padding: var(--space-24) 0 var(--space-16);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    
    .favorites-header h1 {
      color: var(--gold-primary);
      font-family: var(--font-heading);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .favorites-header h1 i {
      color: var(--accent-wine);
    }

    #favorites-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    
    .fav-card {
      position: relative;
    }
    
    .fav-btn-card {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--gold-primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e74c3c;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
    }
    
    .fav-btn-card:hover {
      transform: scale(1.1);
      background: var(--bg-void);
    }
  </style>
</head>
<body>
  <!-- زر الهمبرغر العائم في زاوية الشاشة -->
  <button id="hamburger-btn" class="floating-hamburger">
    <i class="ph ph-list"></i>
  </button>

  <!-- الطبقة الضبابية في الخلفية -->
  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- القائمة الجانبية -->
  <nav id="side-menu" class="side-menu">
    <div class="side-menu-header">
      <img src="public/assets/images/logo.png" alt="Yu-Gi-Oh!" class="side-logo">
      <button id="close-menu-btn" class="close-menu-btn">&times;</button>
    </div>

    <div class="side-menu-links">
      <a href="index.html"><i class="ph ph-house"></i> الرئيسية</a>
      <a href="library.html"><i class="ph ph-cards"></i> البطاقات</a>
      
      <div class="side-divider"></div>
      
      <!-- قسم المستخدم -->
      <a href="#" id="user-login-btn" class="login-link" style="display: none;"><i class="ph ph-sign-in"></i> تسجيل الدخول</a>
      
      <div id="user-profile-container" class="side-user-profile">
        <div class="user-welcome-box">
          <i class="ph ph-user"></i>
          <span id="user-welcome" style="color: var(--gold-bright);"></span>
        </div>
        <a href="account.html"><i class="ph ph-user-circle"></i> حسابي</a>
        <a href="favorites.html" class="active"><i class="ph ph-star"></i> المفضلة</a>
        <a href="friends.html"><i class="ph ph-users"></i> الأصدقاء</a>
        <a href="notifications.html"><i class="ph ph-bell"></i> الإشعارات</a>
        <a href="settings.html"><i class="ph ph-gear"></i> الإعدادات</a>
        <a href="admin/dashboard.html" id="admin-link-dropdown" style="display: none;"><i class="ph ph-shield-check"></i> الإدارة</a>
        <button id="user-logout-btn" class="side-logout-btn"><i class="ph ph-sign-out"></i> تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="favorites-header">
      <h1><i class="ph-fill ph-heart"></i> كروتي المفضلة</h1>
      <span id="fav-count" style="color: var(--text-muted); font-size: 1.1rem;">0 كارت</span>
    </div>

    <div id="loading-state" style="text-align: center; color: var(--text-muted); font-size: 1.2rem; padding: 40px;">
      جاري تحميل المفضلة...
    </div>

    <div id="favorites-container"></div>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/favorites.js"></script>
</body>
</html>
