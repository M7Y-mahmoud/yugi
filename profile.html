<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - Yu-Gi-Oh!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/library.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .profile-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .profile-avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold-primary);
    }
    
    .profile-name {
      color: var(--gold-bright);
      font-size: 2rem;
      margin: 0;
      font-family: var(--font-heading);
    }
    
    .profile-bio {
      color: var(--text-secondary);
      max-width: 600px;
      line-height: 1.6;
    }
    
    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }
    
    .stat-box {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    
    .stat-value {
      display: block;
      font-size: 1.8rem;
      color: var(--gold-primary);
      font-weight: bold;
    }
    
    .stat-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .profile-info-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
  <script type="module" src="js/navbar.js"></script>
</head>
<body>
   <!-- زر الهمبرغر العائم في زاوية الشاشة -->
  <button id="hamburger-btn" class="floating-hamburger">
    <i class="ph ph-list"></i>
  </button>

  <!-- الطبقة الضبابية في الخلفية -->
  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- القائمة الجانبية -->
  <nav id="side-menu" class="side-menu">
    <div class="side-menu-header">
      <img src="public/assets/images/logo.png" alt="Yu-Gi-Oh!" class="side-logo">
      <button id="close-menu-btn" class="close-menu-btn">&times;</button>
    </div>

    <div class="side-search">
      <input type="text" placeholder="ابحث...">
      <span class="search-icon"><i class="ph ph-magnifying-glass"></i></span>
    </div>

    <div class="side-menu-links">
      <a href="index.html"><i class="ph ph-house"></i> الرئيسية</a>
      <a href="library.html"><i class="ph ph-cards"></i> البطاقات</a>
      
      <div class="side-divider"></div>
      
      <!-- قسم المستخدم -->
      <a href="#" id="user-login-btn" class="login-link" style="display: none;"><i class="ph ph-sign-in"></i> تسجيل الدخول</a>
      
      <div id="user-profile-container" class="side-user-profile">
        <div class="user-welcome-box">
          <i class="ph ph-user"></i>
          <span id="user-welcome" style="color: var(--gold-bright);"></span>
        </div>
        <a href="account.html"><i class="ph ph-user-circle"></i> حسابي</a>
        <a href="profile.html" class="active"><i class="ph ph-user"></i> الملف الشخصي</a>
        <a href="favorites.html"><i class="ph ph-star"></i> المفضلة</a>
        <a href="friends.html"><i class="ph ph-users"></i> الأصدقاء</a>
        <a href="notifications.html"><i class="ph ph-bell"></i> الإشعارات</a>
        <a href="settings.html"><i class="ph ph-gear"></i> الإعدادات</a>
        <a href="admin/dashboard.html" id="admin-link-dropdown" style="display: none;"><i class="ph ph-shield-check"></i> الإدارة</a>
        <button id="user-logout-btn" class="side-logout-btn"><i class="ph ph-sign-out"></i> تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container" style="margin-top: 40px;">
    <div id="loading-state" style="text-align: center; font-size: 1.2rem; color: var(--text-secondary);">
      جاري تحميل بيانات الملف الشخصي...
    </div>
    
    <div id="profile-container" style="display: none;">
      <div class="profile-card">
        <img id="profile-avatar" src="https://via.placeholder.com/150" alt="صورة الملف الشخصي" class="profile-avatar">
        
        <div>
          <h2 id="profile-name" class="profile-name">اسم المستخدم</h2>
          <div class="profile-info-row">
            <span><i class="ph ph-calendar"></i> انضم في: <span id="profile-join-date">-</span></span>
            <span><i class="ph ph-clock"></i> آخر ظهور: <span id="profile-last-seen">-</span></span>
          </div>
        </div>
        
        <p id="profile-bio" class="profile-bio">لا يوجد نبذة شخصية.</p>
        
        <div class="profile-stats">
          <div class="stat-box">
            <span id="stat-decks" class="stat-value">0</span>
            <span class="stat-label">المجموعات</span>
          </div>
          <div class="stat-box">
            <span id="stat-favorites" class="stat-value">0</span>
            <span class="stat-label">المفضلة</span>
          </div>
          <div class="stat-box">
            <span id="stat-friends" class="stat-value">0</span>
            <span class="stat-label">الأصدقاء</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
