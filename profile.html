<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - Yu-Gi-Oh!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/library.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .profile-card {
      background: linear-gradient(135deg, rgba(30, 20, 15, 0.95), rgba(18, 12, 8, 0.98));
      border: 1px solid var(--gold-primary);
      border-radius: 16px;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), var(--gold-bright), transparent);
    }
    
    .avatar-wrapper {
      position: relative;
      display: inline-block;
    }

    .profile-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold-primary);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      background: #100b08;
    }

    .avatar-status-dot {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid #120c08;
      background: #7f8c8d;
    }

    .avatar-status-dot.online {
      background: #2ecc71;
      box-shadow: 0 0 10px #2ecc71;
    }
    
    .profile-name {
      color: var(--gold-bright);
      font-size: 2.2rem;
      margin: 0;
      font-family: var(--font-heading);
      letter-spacing: 0.5px;
    }
    
    .profile-bio {
      color: #d1c7bd;
      max-width: 620px;
      line-height: 1.6;
      font-size: 1.05rem;
      background: rgba(0,0,0,0.25);
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      margin: 5px 0;
    }

    .profile-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 5px;
    }

    .profile-btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none;
      font-family: var(--font-arabic);
    }

    .profile-btn-primary {
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-bright));
      color: #0d0805;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }

    .profile-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4);
    }

    .profile-btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--gold-primary);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .profile-btn-secondary:hover {
      background: rgba(212, 175, 55, 0.15);
      transform: translateY(-2px);
    }
    
    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-top: 15px;
    }
    
    .stat-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 16px 10px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      transition: border-color 0.2s;
    }

    .stat-box:hover {
      border-color: var(--gold-primary);
    }
    
    .stat-value {
      display: block;
      font-size: 2rem;
      color: var(--gold-bright);
      font-weight: bold;
      font-family: var(--font-heading);
    }
    
    .stat-label {
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    
    .profile-info-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    /* Mutual Friends Section */
    .mutual-friends-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .mutual-friend-card {
      background: rgba(22, 16, 12, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .mutual-friend-card:hover {
      border-color: var(--gold-primary);
      transform: translateY(-2px);
      background: rgba(35, 25, 18, 0.95);
    }

    .mutual-friend-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      object-fit: cover;
    }

    .mutual-friend-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .mutual-friend-name {
      color: var(--gold-bright);
      font-weight: bold;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mutual-friend-btn {
      color: var(--text-muted);
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 2px;
    }

    /* Section Header */
    .section-header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(212, 175, 55, 0.25);
    }

    .section-header-box h2 {
      margin: 0;
      color: var(--gold-bright);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-heading);
    }

    .decks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .profile-deck-card {
      background: rgba(22, 16, 12, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 15px;
      transition: all 0.25s ease;
      position: relative;
    }

    .profile-deck-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-primary);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .deck-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: bold;
      width: fit-content;
    }

    .deck-badge.public {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.4);
    }

    .deck-badge.private {
      background: rgba(231, 76, 60, 0.15);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.4);
    }

    .deck-stats-pills {
      display: flex;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .deck-pill {
      background: rgba(0,0,0,0.3);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .empty-decks-box {
      text-align: center;
      padding: 45px 20px;
      background: rgba(22, 16, 12, 0.5);
      border: 1px dashed rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      color: var(--text-muted);
    }

    .empty-decks-box i {
      font-size: 3.5rem;
      color: var(--gold-primary);
      margin-bottom: 12px;
      display: block;
    }

    .empty-decks-box h3 {
      color: var(--gold-bright);
      margin: 0 0 8px 0;
    }

    /* Deck Cards Modal */
    .inspect-modal-content {
      background: rgba(18, 12, 8, 0.98);
      border: 1px solid var(--gold-primary);
      border-radius: 14px;
      width: 95%;
      max-width: 850px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.9);
      overflow: hidden;
      margin: auto;
    }

    .inspect-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 20px;
      overflow-y: auto;
      max-height: 60vh;
    }

    .inspect-card-item {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      transition: transform 0.2s;
    }

    .inspect-card-item:hover {
      transform: scale(1.05);
      border-color: var(--gold-primary);
    }

    .inspect-card-img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 4px;
    }

    .inspect-card-name {
      font-size: 0.78rem;
      color: #fff;
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
  <script type="module" src="js/navbar.js"></script>
</head>
<body>
   <!-- زر الهمبرغر العائم في زاوية الشاشة -->
  <button id="hamburger-btn" class="floating-hamburger">
    <i class="ph ph-list"></i>
  </button>

  <!-- الطبقة الضبابية في الخلفية -->
  <div id="menu-overlay" class="menu-overlay"></div>

  <!-- القائمة الجانبية -->
  <nav id="side-menu" class="side-menu">
    <div class="side-menu-header">
      <img src="public/assets/images/logo.png" alt="Yu-Gi-Oh!" class="side-logo">
      <button id="close-menu-btn" class="close-menu-btn">&times;</button>
    </div>

    <div class="side-search">
      <input type="text" placeholder="ابحث...">
      <span class="search-icon"><i class="ph ph-magnifying-glass"></i></span>
    </div>

    <div class="side-menu-links">
      <a href="index.html"><i class="ph ph-house"></i> الرئيسية</a>
      <a href="library.html"><i class="ph ph-cards"></i> البطاقات</a>
      
      <div class="side-divider"></div>
      
      <!-- قسم المستخدم -->
      <a href="#" id="user-login-btn" class="login-link" style="display: none;"><i class="ph ph-sign-in"></i> تسجيل الدخول</a>
      
      <div id="user-profile-container" class="side-user-profile">
        <div class="user-welcome-box">
          <i class="ph ph-user"></i>
          <span id="user-welcome" style="color: var(--gold-bright);"></span>
        </div>
        <a href="account.html"><i class="ph ph-user-circle"></i> حسابي</a>
        <a href="profile.html" class="active"><i class="ph ph-user"></i> الملف الشخصي</a>
        <a href="favorites.html"><i class="ph ph-star"></i> المفضلة</a>
        <a href="friends.html"><i class="ph ph-users"></i> الأصدقاء</a>
        <a href="notifications.html"><i class="ph ph-bell"></i> الإشعارات</a>
        <a href="settings.html"><i class="ph ph-gear"></i> الإعدادات</a>
        <a href="admin/dashboard.html" id="admin-link-dropdown" style="display: none;"><i class="ph ph-shield-check"></i> الإدارة</a>
        <button id="user-logout-btn" class="side-logout-btn"><i class="ph ph-sign-out"></i> تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container" style="margin-top: 40px; margin-bottom: 60px;">
    <div id="loading-state" style="text-align: center; font-size: 1.2rem; color: var(--text-secondary); padding: 50px 0;">
      <i class="ph ph-spinner spinner" style="font-size: 2.5rem; color: var(--gold-primary); display: block; margin-bottom: 12px;"></i>
      جاري تحميل بيانات الملف الشخصي...
    </div>
    
    <div id="profile-container" style="display: none;">
      <!-- Profile Hero Card -->
      <div class="profile-card">
        <div class="avatar-wrapper">
          <img id="profile-avatar" src="https://via.placeholder.com/150" alt="صورة الملف الشخصي" class="profile-avatar">
          <span id="profile-status-dot" class="avatar-status-dot"></span>
        </div>
        
        <div>
          <h2 id="profile-name" class="profile-name">اسم المستخدم</h2>
          <div class="profile-info-row">
            <span><i class="ph ph-calendar"></i> انضم في: <span id="profile-join-date">-</span></span>
            <span><i class="ph ph-clock"></i> آخر ظهور: <span id="profile-last-seen">-</span></span>
          </div>
        </div>
        
        <p id="profile-bio" class="profile-bio">لا يوجد نبذة شخصية.</p>

        <!-- Profile Action Buttons -->
        <div id="profile-actions-container" class="profile-actions">
          <!-- Populated via js/profile.js -->
        </div>
        
        <div class="profile-stats">
          <div class="stat-box">
            <span id="stat-decks" class="stat-value">0</span>
            <span id="stat-decks-label" class="stat-label">المجموعات العامة</span>
          </div>
          <div class="stat-box">
            <span id="stat-favorites" class="stat-value">0</span>
            <span class="stat-label">المفضلة</span>
          </div>
          <div class="stat-box">
            <span id="stat-friends" class="stat-value">0</span>
            <span class="stat-label">الأصدقاء</span>
          </div>
        </div>
      </div>

      <!-- Mutual Friends Section -->
      <div id="mutual-friends-section" class="mutual-friends-section" style="margin-top: 30px; display: none;">
        <div class="section-header-box">
          <h2>
            <i class="ph ph-users-three"></i>
            <span>الأصدقاء المشتركون</span>
            <span id="mutual-count-badge" style="font-size: 0.95rem; color: var(--gold-primary); font-weight: normal; margin-right: 6px;">(0)</span>
          </h2>
        </div>
        <div id="mutual-friends-container" class="mutual-friends-grid">
          <!-- Populated via js/profile.js -->
        </div>
      </div>

      <!-- Public Decks Section -->
      <div class="decks-section" style="margin-top: 40px;">
        <div class="section-header-box">
          <h2>
            <i class="ph ph-cards"></i>
            <span id="decks-section-title">مجموعات الأوراق العامة</span>
          </h2>
          <span id="decks-subtitle" style="color: var(--text-muted); font-size: 0.9rem;"></span>
        </div>

        <div id="public-decks-container" class="decks-grid">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </main>

  <!-- نافذة معاينة كروت المجموعة -->
  <div id="inspect-deck-modal" class="modal" style="z-index: 3500;">
    <div class="inspect-modal-content">
      <div class="chat-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i class="ph ph-cards" style="font-size: 1.5rem; color: var(--gold-primary);"></i>
          <h3 id="inspect-deck-name" style="margin:0; color: var(--gold-bright); font-size: 1.2rem;">معاينة المجموعة</h3>
        </div>
        <button id="close-inspect-modal" class="close-chat-btn">&times;</button>
      </div>

      <div style="padding: 12px 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(212,175,55,0.15); display: flex; justify-content: space-between; align-items: center;">
        <div id="inspect-deck-stats" class="deck-stats-pills"></div>
        <button id="inspect-play-deck-btn" class="profile-btn profile-btn-primary" style="padding: 6px 14px; font-size: 0.85rem;">
          <i class="ph ph-game-controller"></i> اللعب بهذه المجموعة
        </button>
      </div>

      <div id="inspect-cards-container" class="inspect-cards-grid">
        <!-- Cards loaded dynamically -->
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
